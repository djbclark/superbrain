<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#526174}.h{font-size:22px;font-weight:700}.b{font-size:18px}.small{font-size:15px;fill:#526174}.box{fill:#f7f9fc;stroke:#5a6b82;stroke-width:2}.local{fill:#f2f8ff;stroke:#2c6fb7;stroke-width:2}.allow{fill:#f2fbf5;stroke:#398758;stroke-width:2}.deny{fill:#fff4f4;stroke:#cc3030;stroke-width:2}.line{stroke:#526174;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526174"/></marker></defs>
  <text x="80" y="75" class="title">SuperBrain — YouTube API Data handling</text>
  <text x="80" y="110" class="sub">Summary of the data path and explicit compliance boundaries for the self-hosted client.</text>
  <rect x="100" y="205" width="310" height="170" rx="16" class="allow"/><text x="255" y="255" text-anchor="middle" class="h">Permitted inputs</text><text x="255" y="295" text-anchor="middle" class="b">User-authorized subscriptions</text><text x="255" y="325" text-anchor="middle" class="b">Playlists and playlist items</text><text x="255" y="352" text-anchor="middle" class="small">plus public metadata for user-selected videos</text>
  <rect x="645" y="190" width="310" height="200" rx="16" class="local"/><text x="800" y="240" text-anchor="middle" class="h">Local processing</text><text x="800" y="280" text-anchor="middle" class="b">OAuth token: local secret store</text><text x="800" y="310" text-anchor="middle" class="b">Results: local SQLite database</text><text x="800" y="340" text-anchor="middle" class="b">Categories: private playlist mapping</text><text x="800" y="370" text-anchor="middle" class="small">operator controls retention and deletion</text>
  <rect x="1190" y="205" width="310" height="170" rx="16" class="deny"/><text x="1345" y="255" text-anchor="middle" class="h">Explicit exclusions</text><text x="1345" y="295" text-anchor="middle" class="b">No sale of YouTube API Data</text><text x="1345" y="325" text-anchor="middle" class="b">No data-broker enrichment</text><text x="1345" y="352" text-anchor="middle" class="small">No youtube.search.list or replacement player</text>
  <path d="M410 290 H645" class="line"/><path d="M955 290 H1190" class="line"/>
  <rect x="335" y="570" width="930" height="155" rx="16" class="box"/><text x="800" y="620" text-anchor="middle" class="h">User rights and safeguards</text><text x="800" y="658" text-anchor="middle" class="b">Users can revoke Google access, disable playlist synchronization, or delete their local SuperBrain runtime data.</text><text x="800" y="690" text-anchor="middle" class="b">The public Privacy Policy and Terms document these controls and YouTube API Services obligations.</text>
  <path d="M800 390 V570" class="line"/>
</svg>
