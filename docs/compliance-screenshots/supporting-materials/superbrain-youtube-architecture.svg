<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#526174}.h{font-size:23px;font-weight:700}.b{font-size:19px}.small{font-size:16px;fill:#526174}.box{fill:#f7f9fc;stroke:#5a6b82;stroke-width:2}.yt{fill:#fff4f4;stroke:#cc3030;stroke-width:2}.local{fill:#f2f8ff;stroke:#2c6fb7;stroke-width:2}.secure{fill:#f2fbf5;stroke:#398758;stroke-width:2}.line{stroke:#526174;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526174"/></marker></defs>
  <text x="80" y="75" class="title">SuperBrain — YouTube API architecture</text>
  <text x="80" y="110" class="sub">Self-hosted personal content organization; YouTube actions occur only with user-granted OAuth.</text>
  <rect x="80" y="180" width="280" height="180" rx="16" class="box"/><text x="220" y="230" text-anchor="middle" class="h">User</text><text x="220" y="270" text-anchor="middle" class="b">Saves a YouTube video</text><text x="220" y="300" text-anchor="middle" class="b">or authorizes playlist sync</text><text x="220" y="330" text-anchor="middle" class="small">Android app / local browser</text>
  <rect x="520" y="165" width="380" height="220" rx="16" class="local"/><text x="710" y="215" text-anchor="middle" class="h">SuperBrain local instance</text><text x="710" y="255" text-anchor="middle" class="b">FastAPI backend + SQLite</text><text x="710" y="290" text-anchor="middle" class="b">AI summary, tags, and taxonomy</text><text x="710" y="325" text-anchor="middle" class="b">Private category-playlist mapping</text><text x="710" y="355" text-anchor="middle" class="small">Runs on the operator's computer or server</text>
  <rect x="1080" y="180" width="360" height="180" rx="16" class="yt"/><text x="1260" y="230" text-anchor="middle" class="h">YouTube Data API Services</text><text x="1260" y="270" text-anchor="middle" class="b">OAuth authorization</text><text x="1260" y="300" text-anchor="middle" class="b">Subscriptions and private playlists</text><text x="1260" y="330" text-anchor="middle" class="small">No youtube.search.list or playback replacement</text>
  <path d="M360 270 H520" class="line"/><text x="440" y="248" text-anchor="middle" class="small">user-selected content</text>
  <path d="M900 270 H1080" class="line"/><text x="990" y="248" text-anchor="middle" class="small">authorized API requests</text>
  <path d="M1080 320 H900" class="line"/><text x="990" y="355" text-anchor="middle" class="small">playlist / subscription data</text>
  <rect x="370" y="570" width="860" height="175" rx="16" class="secure"/><text x="800" y="620" text-anchor="middle" class="h">Data handling boundary</text><text x="800" y="660" text-anchor="middle" class="b">OAuth refresh token stored in the local secret store; analysis results and playlist mappings stored locally.</text><text x="800" y="695" text-anchor="middle" class="b">SuperBrain does not operate a multi-tenant cloud or sell YouTube API Data.</text><text x="800" y="725" text-anchor="middle" class="small">Access can be revoked in Google Account third-party access settings.</text>
  <path d="M710 385 V570" class="line"/>
</svg>
