[project]
name = ".superbrain-server"
revision = "1.0"

# Extend configurations from subdirectories
# extends = [ "subdir1", "subdir2" ]

[profiles.default]
GROQ_API_KEY = { description = "Groq API key", required = false }
GEMINI_API_KEY = { description = "Gemini API key", required = false }
OPENROUTER_API_KEY = { description = "OpenRouter API key", required = false }
OMLX_API_KEY = { description = "Local omlx OpenAI-compatible API key", required = false }
WEBSUB_HMAC_SECRET = { description = "WebSub payload-signing secret", required = false, type = "password", generate = true }
YOUTUBE_OAUTH_CLIENT_ID = { description = "Google OAuth client ID for YouTube subscriptions and category playlists", required = false }
YOUTUBE_OAUTH_CLIENT_SECRET = { description = "Google OAuth client secret for YouTube subscriptions and category playlists", required = false, type = "password" }
YOUTUBE_OAUTH_REFRESH_TOKEN = { description = "Google OAuth refresh token (youtube scope: subscriptions + playlist manage)", required = false, type = "password" }

[profiles.development]
# Development profile inherits all secrets from default profile
# Only define secrets here that need different values or settings than default
# DATABASE_URL = { default = "sqlite:///dev.db" }
#
# New secrets
# REDIS_URL = { description = "Redis connection URL for caching", required = false, default = "redis://localhost:6379" }
